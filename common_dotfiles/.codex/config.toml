# Portable Codex defaults. Machine-local state belongs in local.config.toml.
model = "gpt-5.6-luna"
model_reasoning_effort = "xhigh"

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

[shell_environment_policy.set]
UV_CACHE_DIR = "/tmp/codex-uv-cache"

[tui]
status_line = ["model-with-reasoning", "current-dir", "reasoning", "git-branch", "permissions", "approval-mode", "context-used", "five-hour-limit", "weekly-limit", "task-progress"]
status_line_use_colors = true

[features]
js_repl = false

[plugins."sites@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."google-calendar@openai-curated"]
enabled = true

[plugins."slack@openai-curated"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[projects."/Users/leoluyi/.dotfiles"]
trust_level = "trusted"
