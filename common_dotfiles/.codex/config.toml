# Portable Codex defaults. Machine-local state belongs in local.config.toml.
model = "gpt-5.6-luna"
model_reasoning_effort = "xhigh"

# Keep normal workspace sandbox while allowing GitHub CLI and API access.
default_permissions = "github"

[permissions]

[permissions.github]
description = "Workspace access with GitHub network access"
extends = ":workspace"

[permissions.github.network]
enabled = true

[permissions.github.network.domains]
"github.com" = "allow"
"api.github.com" = "allow"
"codeload.github.com" = "allow"
"objects.githubusercontent.com" = "allow"
"raw.githubusercontent.com" = "allow"

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest"]

[shell_environment_policy.set]
UV_CACHE_DIR = "/tmp/codex-uv-cache"

[tui]
status_line = ["model-with-reasoning", "current-dir", "reasoning", "git-branch", "permissions", "approval-mode", "context-used", "five-hour-limit", "weekly-limit", "task-progress"]
status_line_use_colors = true

[features]
js_repl = false

[plugins."sites@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."google-calendar@openai-curated"]
enabled = true

[plugins."slack@openai-curated"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."context7@context7-marketplace"]
enabled = true

[plugins."x-skills@x-skills"]
enabled = true

[plugins."sol-advisor@sol-advisor"]
enabled = true

[plugins."ponytail@ponytail"]
enabled = true

